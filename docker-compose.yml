services:
  postgres:
    image: postgres:17
    container_name: task-scheduler-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: task_scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: