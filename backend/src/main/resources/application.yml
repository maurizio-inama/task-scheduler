spring:
  application:
    name: task-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/task_scheduler
    username: scheduler
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  # DEVELOPMENT-ONLY default. In production the JWT signing secret MUST be set
  # via the JWT_SECRET environment variable (at least 32 bytes).
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789abcdef}
  # Token lifetime in seconds (default: 1 hour).
  expiration: ${JWT_EXPIRATION:3600}
